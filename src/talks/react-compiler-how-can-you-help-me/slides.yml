title: Install it
code:
  language: sh
  content: |
    npm install -D babel-plugin-react-compiler@latest
  highlight: 1,1
decorations:
  number: 1
---

title: Enable it
code:
  language: typescript
  content: |
    import react from '@vitejs/plugin-react'
    import { defineConfig } from 'vite'

    export default defineConfig({
      plugins: [
        react({
          babel: {
            plugins: [['babel-plugin-react-compiler']],
          },
        }),
      ],
    })

  highlight: 1-1,6-9
decorations:
  number: 2
---

