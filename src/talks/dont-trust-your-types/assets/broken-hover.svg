    <text x="52" y="174" fill="#64748b">2</text><text x="100" y="174" fill="#e5e7eb">  { method: </text><text x="260" y="174" fill="#86efac">'GET'</text><text x="340" y="174" fill="#e5e7eb">, url: </text><text x="445" y="174" fill="#86efac">'/organizations/:organizationId'</text><text x="960" y="174" fill="#e5e7eb">,</text>
    <text x="52" y="220" fill="#64748b">3</text><text x="100" y="220" fill="#e5e7eb">    handler: async (request) =&gt; {</text>
    <text x="52" y="266" fill="#64748b">4</text><text x="100" y="266" fill="#e5e7eb">      request.params.organizationId</text>
    <text x="52" y="312" fill="#64748b">5</text><text x="100" y="312" fill="#e5e7eb">    },</text>
    <text x="52" y="358" fill="#64748b">6</text><text x="100" y="358" fill="#e5e7eb">  }</text>
    <text x="52" y="404" fill="#64748b">7</text><text x="100" y="404" fill="#e5e7eb">)</text>
    <text x="52" y="490" fill="#64748b">8</text><text x="100" y="490" fill="#c084fc">app</text><text x="150" y="490" fill="#e5e7eb">.register(route)</text>
