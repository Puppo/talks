<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1120" viewBox="0 0 2000 1120" role="img" aria-label="A Fastify route editor hover showing any next to a failing TSTyche type assertion">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0 0L12 6L0 12Z" fill="#fb7185"/>
    </marker>
  </defs>

  <rect width="2000" height="1120" fill="#0b1220"/>
  <rect width="2000" height="72" fill="#111c2f"/>
  <circle cx="34" cy="36" r="11" fill="#fb4d5a"/>
  <circle cx="70" cy="36" r="11" fill="#f6b73c"/>
  <circle cx="106" cy="36" r="11" fill="#35c76f"/>
  <text x="154" y="44" fill="#9aa9bf" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">src/routes/organization-route.ts</text>

  <rect x="52" y="112" width="900" height="900" rx="14" fill="#0f172a" stroke="#2a3a55" stroke-width="2"/>
  <rect x="52" y="112" width="900" height="70" rx="14" fill="#162238"/>
  <rect x="52" y="168" width="900" height="14" fill="#162238"/>
  <text x="92" y="156" fill="#e2e8f0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">organization-route.ts</text>
  <circle cx="900" cy="147" r="6" fill="#64748b"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="27">
    <g fill="#52627a" text-anchor="end">
      <text x="112" y="250">1</text><text x="112" y="302">2</text><text x="112" y="354">3</text>
      <text x="112" y="406">4</text><text x="112" y="458">5</text><text x="112" y="510">6</text>
      <text x="112" y="562">7</text><text x="112" y="614">8</text><text x="112" y="666">9</text><text x="112" y="718">10</text>
    </g>
    <text x="144" y="250" fill="#c084fc">const</text><text x="244" y="250" fill="#e5e7eb"> route = defineRoute(</text>
    <text x="144" y="302" fill="#e5e7eb">  { method: </text><text x="318" y="302" fill="#86efac">'GET'</text><text x="404" y="302" fill="#e5e7eb">,</text>
    <text x="144" y="354" fill="#e5e7eb">    url: </text><text x="270" y="354" fill="#86efac">'/organizations/:organizationId'</text><text x="840" y="354" fill="#e5e7eb">,</text>
    <text x="144" y="406" fill="#e5e7eb">    handler: async (request) =&gt; {</text>
    <text x="144" y="458" fill="#e5e7eb">      request.</text><text x="294" y="458" fill="#fda4af">params</text><text x="408" y="458" fill="#e5e7eb">.organizationId</text>
    <text x="144" y="510" fill="#e5e7eb">    }</text>
    <text x="144" y="562" fill="#e5e7eb">  }</text>
    <text x="144" y="614" fill="#e5e7eb">)</text>
    <text x="144" y="718" fill="#c084fc">app</text><text x="204" y="718" fill="#e5e7eb">.register(route)</text>
  </g>

  <rect x="420" y="520" width="500" height="184" rx="10" fill="#1b2940" stroke="#fb7185" stroke-width="3" filter="url(#shadow)"/>
  <circle cx="454" cy="558" r="8" fill="#fb7185"/>
  <text x="478" y="566" fill="#fda4af" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">editor hover</text>
  <text x="454" y="620" fill="#f8fafc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28">(property) params: </text>
  <text x="730" y="620" fill="#fb7185" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="28" font-weight="700">any</text>
  <text x="454" y="662" fill="#cbd5e1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">the route contract disappeared</text>
  <path d="M520 520C500 500 430 480 376 458" fill="none" stroke="#fb7185" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1010" y="112" width="938" height="900" rx="14" fill="#111827" stroke="#2a3a55" stroke-width="2"/>
  <rect x="1050" y="164" width="858" height="388" rx="12" fill="#f8fafc" filter="url(#shadow)"/>
  <text x="1090" y="214" fill="#1e293b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">route.tst.ts</text>
  <circle cx="1858" cy="205" r="7" fill="#fb7185"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23">
    <text x="1090" y="276" fill="#334155">expect(route).type.toBe&lt;</text>
    <text x="1090" y="314" fill="#2563eb">  RouteDefinition&lt;OrganizationRoute&gt;</text>
    <text x="1090" y="352" fill="#334155">&gt;()</text>
  </g>
  <line x1="1090" y1="378" x2="1868" y2="378" stroke="#fb7185" stroke-width="4"/>
  <text x="1090" y="426" fill="#be123c" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" font-weight="700">FAIL</text>
  <text x="1192" y="426" fill="#9f1239" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">Type 'any' is not the same as</text>
  <text x="1090" y="466" fill="#9f1239" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22">      'OrganizationRoute'</text>
  <text x="1090" y="520" fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="19">1 failed  ·  0 passed</text>

  <rect x="1050" y="604" width="858" height="354" rx="12" fill="#020617" filter="url(#shadow)"/>
  <text x="1090" y="662" fill="#4ade80" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24">$ npx tstyche</text>
  <text x="1090" y="718" fill="#fb7185" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23">fail ./route.tst.ts</text>
  <text x="1090" y="776" fill="#fecdd3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21">Error: expected route contract</text>
  <text x="1090" y="812" fill="#fecdd3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21">to preserve request.params</text>
  <line x1="1090" y1="850" x2="1868" y2="850" stroke="#1e293b" stroke-width="2"/>
  <text x="1090" y="900" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">TypeScript 5.9.3  ·  contract test failed</text>
</svg>
