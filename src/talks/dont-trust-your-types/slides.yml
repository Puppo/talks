layout: code
title: "A tiny Fastify package with a public contract"
className:
  root: talk@code-tight
code:
  language: ts
  numbers: true
  highlight: '1-6, 9-14'
  content: |
    import type { FastifyPluginAsync, RouteGenericInterface } from 'fastify'

    export type RouteContract = RouteGenericInterface
    export type RouteDefinition<T extends RouteContract> =
      FastifyRouteOptions<T>

    export type RouteFactory = <T extends RouteContract>(
      definition: RouteDefinition<T>,
    ) => FastifyPluginAsync

    export const route: RouteFactory = definition => async fastify => {
      fastify.route(definition)
    }
decorations:
  number: 5
---
layout: code
title: "The regression is one character wide"
className:
  root: talk@code-tight
code:
  language: ts
  numbers: true
  highlight: '4'
  content: |
    // Before: inference carries the consumer's route contract
    export type RouteDefinition<T extends RouteContract> =
      FastifyRouteOptions<T>

    // After a harmless-looking refactor...
    export type RouteDefinition<T extends RouteContract> =
      FastifyRouteOptions<any>

    // The app still starts. The user's hover now says: any.
decorations:
  number: 6
---
layout: code
title: "Equality catches the silent any"
className:
  root: talk@code-tight
code:
  language: ts
  numbers: true
  highlight: '8-10'
  content: |
    import { expect, test } from 'tstyche'
    import { route } from 'fastify-route-contracts'
    import type { RouteDefinition } from 'fastify-route-contracts'

    type OrganizationRoute = {
      Params: { organizationId: string }
      Querystring: { include?: 'members' | 'projects' }
      Reply: { id: string; name: string }
    }

    test('organization route keeps its contract', () => {
      expect(route).type.toBe<RouteFactory>()
      expect(organizationDefinition).type.toBe<
        RouteDefinition<OrganizationRoute>
      >()
    })
decorations:
  number: 7
---
layout: code
title: "Can a consumer call it?"
className:
  root: talk@code-tight
code:
  language: ts
  numbers: true
  highlight: '5-8, 11-14'
  content: |
    test('route factory accepts the intended definition', () => {
      expect(route).type.toBeCallableWith(organizationDefinition)
      expect(route).type.not.toBeCallableWith({
        method: 'GET',
        url: '/organizations/:organizationId',
        handler: async () => ({ id: 42, name: 'Acme' }),
      })
    })

    test('the route handler sees the same contract', () => {
      expect(organizationDefinition.handler).type.toBe<
        OrganizationRouteHandler
      >()
    })
decorations:
  number: 8
