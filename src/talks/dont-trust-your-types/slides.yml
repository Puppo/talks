layout: code
title: "The regression is one character wide"
className:
  root: talk@code-tight
code:
  language: ts
  numbers: true
  highlight: '3,7'
  content: |
    // Before: inference carries the consumer's route contract
    export type RouteDefinition<T extends RouteContract> =
      RouteOptions<T>

    // After a harmless-looking refactor...
    export type RouteDefinition<T extends RouteContract> =
      RouteOptions<any>

    // The app still starts. The user's hover now says: any.
