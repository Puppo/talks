layout: code
title: "Reject bad input before runtime"
className:
  root: talk@code-tight
code:
  language: ts
  numbers: true
  highlight: '9-12'
  content: |
    import { expect, test } from 'tstyche'
    import { route } from 'fastify-route-contracts'

    test('a bad reply shape is rejected', () => {
      expect(route).type.not.toBeCallableWith({
        method: 'GET',
        url: '/organizations/:organizationId',
        handler: async () => ({ id: 42, name: 'Acme' }),
      })
    })

    test('a missing route param is rejected', () => {
      expect(route).type.not.toBeCallableWith({
        method: 'GET',
        url: '/organizations',
        handler: async () => ({ id: 'x', name: 'Acme' }),
      })
    })
decorations:
  number: 10
