layout: code
title: "Equality catches the silent any"
className:
  root: talk@code-tight
code:
  language: ts
  numbers: true
  highlight: '16-19'
  content: |
    import { expect, test } from 'tstyche'
    import { route } from 'fastify-route-contracts'
    import type {
      RouteDefinition,
      RouteOptions
    } from 'fastify-route-contracts'

    type OrganizationRoute = {
      Params: { organizationId: string }
      Querystring: { include?: 'members' | 'projects' }
      Reply: { id: string; name: string }
    }

    const organizationDefinition: RouteDefinition<OrganizationRoute> = {
      method: 'GET',
      url: '/organizations/:organizationId',
      handler: async request => ({
        id: request.params.organizationId,
        name: 'Acme'
      })
    }

    test('RouteDefinition preserves its generic', () => {
      // Fails the moment RouteDefinition<T> widens to RouteOptions<any>.
      expect<RouteDefinition<OrganizationRoute>>().type.toBe<
        RouteOptions<OrganizationRoute>
      >()
    })
decorations:
  number: 8
