title: 'Inside the agent loop'
content:
  - <span class="talk@eyebrow">02 / How an agent takes action</span>
  - Goal + history → decision → tool → result ↺
items:
  entries:
    - title: 1 · Agent
      text: Ask the model for the next action.
      className:
        root: talk@role talk@agent talk@compact-item
    - title: 2 · Application
      text: Validate and execute the tool call.
      className:
        root: talk@role talk@app talk@compact-item
    - title: 3 · Agent
      text: Read the result; continue or finish.
      className:
        root: talk@role talk@agent talk@compact-item
  horizontal: true
  className: talk@compact-items
notes: |-
  Takeaway: The result becomes input to the next decision.

  Time: 60 seconds.

  The application dispatches tool calls and retains their results with call identifiers. A final answer ends the run. A bounded budget and cancellation stop it safely. The location of this loop does not determine whether model inference runs locally or remotely.

  Transition: Connect each step to the actual TypeScript implementation.

  Sources (checked 2026-10-12):
  - https://bandarra.me/posts/bringing-the-agent-loop-to-the-web
decorations:
  permalink: false

