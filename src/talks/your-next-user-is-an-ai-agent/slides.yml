title: 'One application, different ways to act'
content:
  - <span class="talk@eyebrow">01 / Your website has a new user</span>
items:
  entries:
    - title: Human UI
      text: A person reads, filters, and chooses.
      className:
        root: talk@role talk@person talk@compact-item
    - title: Browser agent
      text: An agent operates the visible interface.
      className:
        root: talk@role talk@agent talk@compact-item
    - title: Embedded agent
      text: The application owns the orchestration loop.
      className:
        root: talk@role talk@agent talk@compact-item
    - title: Visiting agent
      text: The user’s assistant calls exposed tools.
      className:
        root: talk@role talk@app talk@compact-item
  horizontal: false
  className: talk@compact-items
notes: |-
  Takeaway: Agent location and interaction method are separate choices.

  Time: 55 seconds.

  These modes can coexist. An embedded agent can use WebMCP too; browser UI interaction is not an obsolete first step. Our route: interface → loop → tools → control → evidence. Colours and explicit labels identify the person, agent, and application throughout.

  Transition: First, try the interface we already have.

  Sources (checked 2026-10-12):
  - https://www.kulikowski.me/blog/the-spectrum-of-agentic-interactions
  - https://www.kulikowski.me/blog/bring-your-own-agent
