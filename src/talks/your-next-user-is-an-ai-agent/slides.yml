title: 'The loop and the model can live apart'
content:
  - Conceptual architecture · not a claim about the pending app
items:
  entries:
    - title: Browser
      text: Conversation state, UI, tool dispatch, user interaction.
      className:
        root: talk@role talk@agent talk@compact-item
    - title: Server
      text: Credentials, authorization, durable writes, remote-model access.
      className:
        root: talk@role talk@app talk@compact-item
    - title: Shared rules
      text: Human actions and agent calls follow the same constraints.
      className:
        root: talk@role talk@person talk@compact-item
  horizontal: true
  className: talk@compact-items
notes: |-
  Takeaway: Client-side orchestration does not imply local inference.

  Time: Optional / outside the 30-minute narrative.

  This is one possible architecture. A server-side loop can also coordinate browser tools; choose based on the journey. Never embed provider secrets in shipped frontend code. Mark the implemented architecture after app integration.

  Transition: Return to slide 8.

  Sources (checked 2026-10-12):
