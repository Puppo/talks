title: 'Who gets to decide?'
content:
  - <span class="talk@eyebrow">04 / Keep the person in control</span>
  - <span class="talk@pending">Pending integration · proposal diff + approval/rejection capture</span>
items:
  entries:
    - title: Agent · propose
      text: Show additions, removals, preserved choices, and trade-offs.
      className:
        root: talk@role talk@agent talk@compact-item
    - title: Person · decide
      text: Approve, reject, or ask for a revision.
      className:
        root: talk@role talk@person talk@compact-item
    - title: Application · enforce
      text: Commit only the approved change against current state.
      className:
        root: talk@role talk@app talk@compact-item
  horizontal: false
  className: talk@compact-items
notes: |-
  Takeaway: Approval must govern the actual state change.

  Time: 180 seconds.

  Demo D: 30-second explanation plus 150-second control sequence. Reject once: the saved agenda must remain unchanged. Revise, inspect, then approve. The app must verify approval against the specific proposal and current agenda, even if a tool description is misleading. If the UI changes while approval is pending, require a refreshed proposal.

  Transition: What happens when the request cannot be completed?
decorations:
  permalink: false

---
title: 'Failure should help the next step'
content:
  - <span class="talk@pending">Pending integration · real conflict or verified unavailable field</span>
items:
  entries:
    - title: Conflict
      text: Identify the overlapping sessions; preserve saved choices.
      className:
        root: talk@compact-item
    - title: Missing information
      text: Say what is unknown; ask for a preference or relax a constraint.
      className:
        root: talk@compact-item
    - title: Recovery
      text: Return a useful next action, not a false success.
      className:
        root: talk@compact-item
  horizontal: false
  className: talk@compact-items
notes: |-
  Takeaway: Explain constraints without inventing facts.

  Time: 90 seconds.

  Choose the failure from the reviewed event snapshot. Do not assume recording availability is missing, or invent capacity, prices, or reservations. A proposed conflict scenario is acceptable planning material; it is not an observed result. After a failed write, verify whether any state changed before retrying.

  Transition: Even a successful-looking run needs an outcome check.

  Sources (checked 2026-10-12):
  - https://developer.chrome.com/docs/ai/webmcp/build-tools
decorations:
  permalink: false

---
title: '“Done” is a claim'
content:
  - <span class="talk@eyebrow">05 / Prove the task succeeded</span>
  - <span class="talk@pending">Pending integration · persisted agenda + evaluation output</span>
items:
  entries:
    - title: Application tests
      text: Rules, persistence, rejection, and stale approvals.
      className:
        root: talk@compact-item
    - title: Model evaluations
      text: Repeat journeys; inspect final constraints and trade-offs.
      className:
        root: talk@compact-item
    - title: Browser integration
      text: Real client, tool discovery, UI agreement, and reload.
      className:
        root: talk@compact-item
  horizontal: false
  className: talk@compact-items
notes: |-
  Takeaway: Verify the saved outcome, not just the call log.

  Time: 140 seconds.

  Read back the agenda after reloading. All session IDs must exist in the reviewed dataset; selected times must not overlap; original selections must survive unless an explicitly approved replacement permits a change. Rejection must preserve the original agenda. Report expected assertions separately from actual results; no scores exist yet.

  Transition: Then look for journeys the call log never captured.

  Sources (checked 2026-10-12):
  - https://developer.chrome.com/docs/ai/webmcp/evals
decorations:
  permalink: false

---
title: 'Learn from journeys that fail'
content:
  - <span class="talk@pending">Pending integration · local capability report + repeat evaluation</span>
items:
  entries:
    - title: Observe the gap
      text: Record the unmet capability and minimal local context.
      className:
        root: talk@compact-item
    - title: Improve the contract
      text: Review descriptions, missing actions, and recovery paths.
      className:
        root: talk@compact-item
    - title: Evaluate again
      text: Repeat the failed journey after the change.
      className:
        root: talk@compact-item
  horizontal: false
  className: talk@compact-items
notes: |-
  Takeaway: Invocation logs do not capture every unmet need.

  Time: 100 seconds.

  Our intended report is local and reviewed, not an automatic external support ticket. Include the goal, available capabilities, and failure category; omit secrets and unrelated conversation history. A report is evidence to investigate, not a mandate to implement whatever an agent requests. This is an application design inspired by feedback-loop experiments, not a standard WebMCP reporting API.

  Transition: Close with a change the audience can try on Monday.

  Sources (checked 2026-10-12):
  - https://bandarra.me/posts/webmcp-feedback-loop
decorations:
  permalink: false

