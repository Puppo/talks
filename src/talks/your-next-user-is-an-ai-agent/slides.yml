---
title: 'Approval belongs to the application'
content:
  - A schema or annotation is not an authorization check.
items:
  entries:
    - title: Propose
      text: Create an inspectable change tied to the current agenda.
      className:
        root: talk@compact-item
    - title: Approve
      text: Record the person’s decision for that exact change.
      className:
        root: talk@compact-item
    - title: Commit
      text: Recheck rules and current state; reject a stale proposal.
      className:
        root: talk@compact-item
  horizontal: false
  className: talk@compact-items
notes: |-
  Takeaway: A tool cannot approve its own meaningful change.

  Time: Optional / outside the 30-minute narrative.

  Test direct tool calls that attempt to skip approval. Rejection, cancellation, and stale-state detection must not accidentally persist a proposal. Show revision rather than silently applying a different change. These are intended acceptance criteria until the app is available.

  Transition: Return to slide 16.
decorations:
  permalink: false

