title: 'A loop needs an exit'
content:
  - The UI must show stopped, failed, pending, or completed.
items:
  entries:
    - title: Bound the work
      text: Limit turns, elapsed time, and repeated failures.
      className:
        root: talk@compact-item
    - title: Cancel cooperatively
      text: Propagate cancellation to in-flight operations.
      className:
        root: talk@compact-item
    - title: Check the outcome
      text: Cancellation does not undo a completed mutation.
      className:
        root: talk@compact-item
  horizontal: false
  className: talk@compact-items
notes: |-
  Takeaway: Stopping orchestration and reverting state are different operations.

  Time: Optional / outside the 30-minute narrative.

  The app must retain the correct call/result association and expose a stop control. A timeout should produce a visible state, not an endless spinner. After interruption, read the actual agenda before retrying. Budget values belong to the real app; the stage runbook uses an independent stall cutoff.

  Transition: Return to slide 9.
decorations:
  permalink: false

