title: 'Make capabilities explicit'
content:
  - <span class="talk@eyebrow">03 / Give your application a tool interface</span>
  - WebMCP exposes tools. It does not supply the model or loop.
items:
  entries:
    - title: Read
      text: Find sessions · inspect details · read the agenda.
      className:
        root: talk@role talk@app talk@compact-item
    - title: Propose
      text: Prepare a change and explain its trade-offs.
      className:
        root: talk@role talk@agent talk@compact-item
    - title: Decide
      text: The person approves or rejects the proposed change.
      className:
        root: talk@role talk@person talk@compact-item
  horizontal: false
  className: talk@compact-items
notes: |-
  Takeaway: Expose useful intentions backed by existing application rules.

  Time: 70 seconds.

  This is the proposed capability map, not a registered tool listing. Both UI handlers and tools should use the same business logic. A description and schema help interpretation; runtime validation and authorization still belong to the application. Actual names and schemas are pending.

  Transition: A form can be an entry point.

  Sources (checked 2026-10-12):
  - https://developer.chrome.com/docs/ai/webmcp/build-tools
  - https://developer.chrome.com/docs/ai/webmcp/imperative-api
