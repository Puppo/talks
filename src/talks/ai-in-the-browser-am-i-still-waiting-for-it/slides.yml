title: "The Rise of Local LLMs 🏠"
options:
  background: nf-green-50
---

title: "The Need for Local Intelligence"
items:
  entries:
    - title: Definition
      text: Local LLMs are models downloaded and run directly on the user's device (PC, phone, tablet)
    - title: The Enabler
      text: Breakthroughs in Model Quantization - reducing the model's precision to drastically cut size and memory demands while preserving capability
decorations:
  logo: white
---

title: "The Local Promise: Speed and Privacy"
items:
  entries:
    - title: Superior Privacy
      text: "100% client-side computation. Data never leaves the device or network perimeter"
      index: 1
    - title: Low Latency
      text: Inference occurs locally, eliminating network lag for near-instant responses
      index: 2
    - title: Offline Functionality
      text: "Works anywhere, anytime, once the model is loaded"
      index: 3
    - title: Cost-Effective
      text: Zero API costs everything run in the user's environment 🥳
      index: 4
  sequence: true
decorations:
  logo: white
