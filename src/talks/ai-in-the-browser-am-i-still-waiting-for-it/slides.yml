title: "WebLLM: LLMs in the Browser 🌐"
options:
  background: nf-blue-50
---

title: "WebLLM"
items:
  entries:
    - title: WebLLM
      text: (developed by the MLC-AI team) is a high-performance, in-browser inference engine
      icon: chevron-right
    - title: Goal
      text: Bring powerful, capable LLMs directly into the standard web browser
      icon: chevron-right
    - title: Vision
      text: Run LLMs locally just by opening a webpage—zero environment setup
      icon: chevron-right
  sequence: true
decorations:
  logo: white
---

title: "The WebLLM Technology Stack"
items:
  entries:
    - title: WebGPU
      text: A new graphics API that grants web code efficient access to the local GPU for tensor operations (matrix math)
      icon: chevron-right
    - title: WebAssembly (WASM)
      text: Provides a near-native execution environment for model computations, ensuring high speed
      icon: chevron-right
    - title: Caching
      text: The model weights (quantized) and WASM modules are downloaded once and cached locally
      icon: chevron-right
  sequence: true
decorations:
  logo: white
---

title: "WebLLM for Developers"
items:
  entries:
    - title: Familiarity
      text: Provides an OpenAI-API style interface for easy integration into existing chat and generation apps
      index: 1
    - title: Performance
      text: Uses Web Workers to run the heavy inference engine on a separate thread, keeping the main UI fast and responsive
      index: 2
    - title: Key Takeaway
      text: WebLLM proved that full LLM inference is technically feasible within the standard, open-source web stack
      index: 3
  sequence: true
decorations:
  logo: white
---

title: How the interface looks likes 1/2
code:
  language: ts
  content: |
    import { CreateMLCEngine, MLCEngine } from "@mlc-ai/web-llm";

    // Initialize with a progress callback
    const initProgressCallback = (progress) => {
        console.log("Model loading progress:", progress);
    };

    // Using CreateMLCEngine
    const engine = await CreateMLCEngine("Llama-3.1-8B-Instruct", { initProgressCallback });

    // Direct instantiation
    const engineInstance = new MLCEngine({ initProgressCallback });
    await engineInstance.reload("Llama-3.1-8B-Instruct");
---

title: How the interface looks likes 2/2
code:
  language: ts
  content: |
    const messages = [
        { role: "system", content: "You are a helpful AI assistant." },
        { role: "user", content: "Hello!" }
    ];

    const reply = await engine.chat.completions.create({
        messages,
    });

    console.log(reply.choices[0].message);
    console.log(reply.usage);
