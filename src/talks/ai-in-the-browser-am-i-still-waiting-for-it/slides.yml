title: How the interface looks for developers 1/3
code:
  language: js
  content: |
    if ('LanguageDetector' in self) {
      const detector = await LanguageDetector.create({
        monitor(m) {
          m.addEventListener('downloadprogress', (e) => {
            console.log(`Downloaded ${e.loaded * 100}%`);
          });
        },
      });
      const someUserText = 'Hallo und herzlich willkommen!';
      const results = await detector.detect(someUserText);
      for (const result of results) {
        console.log(result.detectedLanguage, result.confidence);
      }
    }
---

title: How the interface looks for developers 2/3
code:
  language: js
  content: |
    if ('Translator' in self) {
      const translator = await Translator.create({
        sourceLanguage: 'es',
        targetLanguage: 'fr',
        monitor(m) {
          m.addEventListener('downloadprogress', (e) => {
            console.log(`Downloaded ${e.loaded * 100}%`);
          });
        },
      });
      const translation = await translator.translate('Where is the next bus stop, please?');
      const stream = translator.translateStreaming(longText);
      for await (const chunk of stream) {
        console.log(chunk);
      }
    }
---

title: How the interface looks for developers 3/3
code:
  language: js
  content: |
    if ('Summarizer' in self) {
      const summarizer = await Summarizer.create({
        monitor(m) {
          m.addEventListener('downloadprogress', (e) => {
            console.log(`Downloaded ${e.loaded * 100}%`);
          });
        }
      });
      const summary = await summarizer.summarize(longText, {
        context: 'This article is intended for a tech-savvy audience.',
      });
      const stream = summarizer.summarizeStreaming(longText, {
        context: 'This article is intended for junior developers.',
      });
      for await (const chunk of stream) {
        console.log(chunk);
      }
    }
