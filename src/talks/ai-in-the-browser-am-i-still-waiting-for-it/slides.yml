title: "The Status Quo: Cloud-First AI"
items:
  entries:
    - title: "Most familiar LLMs run on remote servers"
      text: GPT-4, large Gemini models
      index: 1
    - title: This approach grants access to massive models
      text: Hundreds of billions of parameters
      index: 2
    - title: Pros
      text: Instant scalability, access to the latest, most powerful models
      index: 3
    - title: The Catch
      text: We often overlook the hidden costs and dependencies of this architecture
      index: 4
  sequence: true
decorations:
  logo: white
---

title: "The Cost & Latency Bottleneck 1/2"
items:
  entries:
    - title: High Cost
      text: Operating on a "pay-per-token" model
      icon: chevron-right
    - title: Low usage is cheap
      text: But high volume/long-term use can be 2x to 3x more expensive than running locally
      icon: chevron-right
    - title: Costs are unpredictable
      text: Scale rapidly with adoption
      icon: chevron-right
  sequence: true
decorations:
  logo: white
---

title: "The Cost & Latency Bottleneck 2/2"
items:
  entries:
    - title: Network Latency
      text: Inference requests must travel over the internet
      icon: chevron-right
    - title: Introduces unavoidable delays (latency)
      text: that make true real-time interaction difficult
      icon: chevron-right
    - title: Stable internet connectivity
      text: Required for every interaction
      icon: chevron-right
  sequence: true
decorations:
  logo: white
---

title: "Privacy and Control Concerns"
items:
  entries:
    - title: Data is Leaving the Device
      text: "Privacy Risk: Sending sensitive user data to a third-party server (API provider) is a non-starter for many compliance-sensitive applications"
      icon: chevron-right
    - title: Loss of Control
      text: Limited visibility into the model's execution
      icon: chevron-right
    - title: Vendor lock-in
      text: Dependency on specific API providers
      icon: chevron-right
    - title: Zero offline capability
      text: No internet connection means no AI assistance
      icon: chevron-right
  sequence: true
decorations:
  logo: white
