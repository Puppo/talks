# Build settings for git-based deploys run by Netlify. The redirects live in dist/deploy/site/_redirects,
# generated by `freya deploy` (see src/build/cli.ts).
[build]
  # Download Chromium for PDF export without requiring root access for OS packages.
  command = "npx playwright install chromium && npm run deploy"
  publish = "dist/deploy/site"

[build.environment]
  NODE_VERSION = "24"
