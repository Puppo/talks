# Build settings for git-based deploys run by Netlify. The redirects live in dist/deploy/site/_redirects,
# generated by `freya deploy` (see src/build/cli.ts).
[build]
  # PDF export needs Chromium even when npm skips dependency install scripts.
  command = "npx playwright install --with-deps chromium && npm run deploy"
  publish = "dist/deploy/site"

[build.environment]
  NODE_VERSION = "24"
